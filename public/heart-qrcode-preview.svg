<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1026" />
      <stop offset="50%" stop-color="#1E1028" />
      <stop offset="100%" stop-color="#3A1028" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#FDF6B2" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#F43F5E" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#F59E0B" opacity="0.10" filter="url(#glow)" />

  <!-- Outer Elegant Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="52" y="52" width="1096" height="526" rx="20" fill="none" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.25" />

  <!-- Decorative Corner Accents -->
  <circle cx="65" cy="65" r="5" fill="#FCD34D" />
  <circle cx="1135" cy="65" r="5" fill="#FCD34D" />
  <circle cx="65" cy="565" r="5" fill="#FCD34D" />
  <circle cx="1135" cy="565" r="5" fill="#FCD34D" />

  <!-- Left Content Area -->
  <g transform="translate(100, 150)">
    <!-- Subtitle Pill -->
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#F43F5E" fill-opacity="0.2" stroke="#FB7185" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="140" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FECDD3" text-anchor="middle" letter-spacing="2">GIRLFRIEND'S DAY 2026</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="Georgia, serif" font-size="64" font-weight="700" fill="url(#gold)">For My Momma ❤️</text>

    <!-- Romantic Tagline -->
    <text x="0" y="175" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#FFF1F2" opacity="0.95">
      An interactive romantic journey of love,
    </text>
    <text x="0" y="215" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#FFF1F2" opacity="0.95">
      blooming flowers, our songs &amp; a secret letter.
    </text>

    <!-- Interactive Badge -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="340" height="48" rx="24" fill="#3B182B" stroke="#FCD34D" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="170" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#FDE68A" text-anchor="middle">✨ Scan QR or Click Link to Unlock Love</text>
    </g>
  </g>

  <!-- Right Side: Heart QR Code Illustration -->
  <g transform="translate(780, 140)">
    <!-- Glowing Backing Card -->
    <rect x="-20" y="-20" width="310" height="360" rx="28" fill="#180D20" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.6" filter="url(#glow)" />
    <rect x="-20" y="-20" width="310" height="360" rx="28" fill="#1A1028" stroke="url(#gold)" stroke-width="2" />

    <!-- QR Code Mockup Frame (White high contrast QR box) -->
    <rect x="25" y="25" width="220" height="220" rx="18" fill="#FFFFFF" />

    <!-- QR Code Outer Position Markers -->
    <rect x="45" y="45" width="46" height="46" rx="8" fill="#1E1028" />
    <rect x="53" y="53" width="30" height="30" rx="4" fill="#FFFFFF" />
    <rect x="61" y="61" width="14" height="14" rx="2" fill="#F43F5E" />

    <rect x="179" y="45" width="46" height="46" rx="8" fill="#1E1028" />
    <rect x="187" y="53" width="30" height="30" rx="4" fill="#FFFFFF" />
    <rect x="195" y="61" width="14" height="14" rx="2" fill="#F43F5E" />

    <rect x="45" y="179" width="46" height="46" rx="8" fill="#1E1028" />
    <rect x="53" y="187" width="30" height="30" rx="4" fill="#FFFFFF" />
    <rect x="61" y="195" width="14" height="14" rx="2" fill="#F43F5E" />

    <!-- QR Code stylized pixel dots -->
    <circle cx="110" cy="55" r="5" fill="#1E1028" />
    <circle cx="130" cy="55" r="5" fill="#1E1028" />
    <circle cx="150" cy="55" r="5" fill="#F43F5E" />
    <circle cx="110" cy="75" r="5" fill="#1E1028" />
    <circle cx="150" cy="75" r="5" fill="#1E1028" />
    <circle cx="110" cy="95" r="5" fill="#F59E0B" />
    <circle cx="130" cy="95" r="5" fill="#1E1028" />
    <circle cx="150" cy="95" r="5" fill="#1E1028" />

    <circle cx="55" cy="115" r="5" fill="#1E1028" />
    <circle cx="75" cy="115" r="5" fill="#1E1028" />
    <circle cx="195" cy="115" r="5" fill="#1E1028" />
    <circle cx="215" cy="115" r="5" fill="#F43F5E" />

    <circle cx="55" cy="140" r="5" fill="#1E1028" />
    <circle cx="215" cy="140" r="5" fill="#1E1028" />

    <circle cx="115" cy="195" r="5" fill="#1E1028" />
    <circle cx="135" cy="195" r="5" fill="#F43F5E" />
    <circle cx="155" cy="195" r="5" fill="#1E1028" />
    <circle cx="115" cy="215" r="5" fill="#1E1028" />
    <circle cx="155" cy="215" r="5" fill="#1E1028" />

    <!-- CENTER HEART IN QR CODE -->
    <circle cx="135" cy="135" r="36" fill="#FFFFFF" />
    <circle cx="135" cy="135" r="32" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2" />
    <path d="M135 152 C 135 152, 112 135, 112 121 C 112 113, 118 108, 125 108 C 130 108, 133 111, 135 114 C 137 111, 140 108, 145 108 C 152 108, 158 113, 158 121 C 158 135, 135 152, 135 152 Z" fill="url(#rose)" />

    <!-- Label Below QR Code inside card -->
    <text x="135" y="280" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FCD34D" text-anchor="middle">HEART QR CODE</text>
    <text x="135" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FECDD3" text-anchor="middle" opacity="0.85">Scan to Unlock My Love Letter ❤️</text>
  </g>
</svg>
