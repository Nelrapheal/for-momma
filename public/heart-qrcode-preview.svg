<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1026" />
      <stop offset="50%" stop-color="#1E1028" />
      <stop offset="100%" stop-color="#3A1028" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#FDF6B2" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#F43F5E" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#F59E0B" opacity="0.10" filter="url(#glow)" />

  <!-- Outer Elegant Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="52" y="52" width="1096" height="526" rx="20" fill="none" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.25" />

  <!-- Decorative Corner Accents -->
  <circle cx="65" cy="65" r="5" fill="#FCD34D" />
  <circle cx="1135" cy="65" r="5" fill="#FCD34D" />
  <circle cx="65" cy="565" r="5" fill="#FCD34D" />
  <circle cx="1135" cy="565" r="5" fill="#FCD34D" />

  <!-- Left Content Area -->
  <g transform="translate(100, 150)">
    <!-- Subtitle Pill -->
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#F43F5E" fill-opacity="0.2" stroke="#FB7185" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="140" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FECDD3" text-anchor="middle" letter-spacing="2">GIRLFRIEND'S DAY 2026</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="Georgia, serif" font-size="64" font-weight="700" fill="url(#gold)">For My Momma ❤️</text>

    <!-- Romantic Tagline -->
    <text x="0" y="175" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#FFF1F2" opacity="0.95">
      An interactive romantic journey of love,
    </text>
    <text x="0" y="215" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#FFF1F2" opacity="0.95">
      blooming flowers, our songs &amp; a secret letter.
    </text>

    <!-- Interactive Badge -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="360" height="48" rx="24" fill="#3B182B" stroke="#FCD34D" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="180" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#FDE68A" text-anchor="middle">✨ Tap to Open Your Girlfriend's Day Surprise ❤️</text>
    </g>
  </g>

  <!-- Right Side: Romantic Envelope & Heart Flower Illustration -->
  <g transform="translate(760, 130)">
    <!-- Glowing Backing Card -->
    <rect x="-20" y="-20" width="340" height="380" rx="32" fill="#180D20" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.6" filter="url(#glow)" />
    <rect x="-20" y="-20" width="340" height="380" rx="32" fill="#1A1028" stroke="url(#gold)" stroke-width="2" />

    <!-- Romantic Wax-Sealed Envelope Illustration -->
    <g transform="translate(35, 30)">
      <rect x="0" y="0" width="230" height="170" rx="14" fill="#2E162B" stroke="url(#gold)" stroke-width="2" />
      <path d="M 0 0 L 115 100 L 230 0" fill="none" stroke="#F43F5E" stroke-width="2" stroke-opacity="0.6" />
      <path d="M 0 170 L 85 95" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.4" />
      <path d="M 230 170 L 145 95" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.4" />

      <!-- Glowing Heart Wax Seal -->
      <circle cx="115" cy="100" r="28" fill="#E11D48" stroke="#FCD34D" stroke-width="2" />
      <path d="M115 113 C 115 113, 97 100, 97 89 C 97 83, 102 79, 107 79 C 111 79, 113 82, 115 84 C 117 82, 119 79, 123 79 C 128 79, 133 83, 133 89 C 133 100, 115 113, 115 113 Z" fill="#FFF1F2" />
    </g>

    <!-- Floating Sparkles -->
    <circle cx="30" cy="225" r="4" fill="#FCD34D" />
    <circle cx="260" cy="60" r="6" fill="#F43F5E" />
    <circle cx="270" cy="210" r="5" fill="#FDE68A" />

    <!-- Card Footer Label -->
    <text x="150" y="270" font-family="Georgia, serif" font-size="22" font-weight="700" fill="url(#gold)" text-anchor="middle">A SURPRISE IN BLOOM</text>
    <text x="150" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#FECDD3" text-anchor="middle" opacity="0.9">Unlocks August 1st, 2026 ❤️</text>
  </g>
</svg>
